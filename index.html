<style>
    :root {
        --bg: #f7f6f2;
        --navy: #14213d;
        --navy-light: #1f325c;
        --gold: #9a7b3e;
        --gold-bright: #d4af37;
        --text-main: #1e293b;
        --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        font-family: 'Heebo', Arial, sans-serif;
        background: var(--bg);
    }
    #loginScreen {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: linear-gradient(180deg, rgba(247,246,242,0.55), rgba(247,246,242,0.88));
    }
    .lock-card {
        max-width: 560px;
        width: 100%;
        text-align: center;
    }
    .lock-hero {
        background: linear-gradient(180deg, #182848 0%, var(--navy) 100%);
        border-radius: 14px;
        border-bottom: 6px solid var(--gold);
        box-shadow: 0 4px 18px rgba(20, 33, 61, 0.18);
        padding: 48px 32px 40px;
    }
    .lock-title {
        font-family: 'Frank Ruhl Libre', serif;
        font-weight: 900;
        font-size: 34px;
        color: #ffffff;
        margin: 0;
    }
    .lock-title span {
        color: var(--gold-bright);
    }
    .lock-notice {
        font-size: 17px;
        font-weight: 500;
        color: var(--navy);
        line-height: 1.9;
        margin: 32px 10px 34px;
        text-shadow:
            0 1px 0 #fff,
            0 0 14px rgba(255, 255, 255, 0.9),
            0 0 28px rgba(255, 255, 255, 0.75);
    }
    .lock-form-wrap {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(20, 33, 61, 0.08);
        border: 1px solid #e2dfd7;
        padding: 32px 28px;
    }
    .lock-form-label {
        font-size: 14px;
        color: var(--text-muted);
        margin: 0 0 14px;
    }
    input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 15px 16px;
        font-size: 19px;
        letter-spacing: 2px;
        text-align: center;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        margin-bottom: 16px;
        direction: ltr;
        background: #fff;
    }
    input[type="password"]:focus { border-color: var(--gold); }
    button {
        width: 100%;
        padding: 15px 16px;
        font-size: 17px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: var(--navy);
        color: #fff;
        cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--navy-light); }
    button:disabled { opacity: 0.6; cursor: default; }
    .lock-error {
        color: #dc2626;
        font-size: 14px;
        margin-top: 12px;
        min-height: 18px;
    }
    .shake { animation: lockShake 0.35s; }
    @keyframes lockShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }
    .bg-photos {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .bg-photo {
        position: absolute;
        width: 280px;
        background: linear-gradient(135deg, #e3c687 0%, var(--gold) 55%, #7d6128 100%);
        padding: 12px;
        border-radius: 14px;
        box-shadow:
            0 24px 50px rgba(20, 33, 61, 0.38),
            0 4px 14px rgba(20, 33, 61, 0.22),
            inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        animation-name: photoFloat;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        will-change: transform;
    }
    .bg-photo img {
        display: block;
        width: 100%;
        height: 230px;
        object-fit: cover;
        border-radius: 7px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .bg-photo--1 { --r: -9deg; top: 4%;   left: 2%;             animation-duration: 6s;   }
    .bg-photo--2 { --r: 7deg;  top: 5%;   right: 2%;            animation-duration: 6.6s; animation-delay: .4s; }
    .bg-photo--3 { --r: 6deg;  top: 40%;  left: 0%;   width: 300px; animation-duration: 7.2s; animation-delay: .9s; }
    .bg-photo--4 { --r: -6deg; top: 42%;  right: 0%;  width: 300px; animation-duration: 6.9s; animation-delay: .2s; }
    .bg-photo--5 {
        --r: 3deg;
        width: 260px;
        bottom: 3%;
        left: 50%;
        margin-left: -130px;
        animation-duration: 7.5s;
        animation-delay: .7s;
    }
    @keyframes photoFloat {
        0%   { transform: rotate(var(--r)) translate(0, 0); }
        50%  { transform: rotate(calc(var(--r) + 2.5deg)) translate(8px, -22px); }
        100% { transform: rotate(var(--r)) translate(0, 0); }
    }
    @media (max-width: 760px) {
        .bg-photo { width: 170px; }
        .bg-photo img { height: 140px; }
        .bg-photo--3, .bg-photo--4 { display: none; }
        .bg-photo--1 { top: 2%; left: 1%; }
        .bg-photo--2 { top: 3%; right: 1%; }
        .bg-photo--5 { width: 190px; margin-left: -95px; bottom: 1%; }
        @keyframes photoFloat {
            0%   { transform: rotate(var(--r)) translate(0, 0); }
            50%  { transform: rotate(calc(var(--r) + 2deg)) translate(5px, -12px); }
            100% { transform: rotate(var(--r)) translate(0, 0); }
        }
    }
    @media (prefers-reduced-motion: reduce) {
        .bg-photo { animation: none; transform: rotate(var(--r)); }
    }
    #siteFrame {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>
</head>
<body>

<div class="bg-photos" aria-hidden="true">
    <div class="bg-photo bg-photo--1"><img src="חתונה1.png" alt="" onerror="this.closest('.bg-photo').style.display='none'"></div>
    <div class="bg-photo bg-photo--2"><img src="חתונה2.png" alt="" onerror="this.closest('.bg-photo').style.display='none'"></div>
    <div class="bg-photo bg-photo--3"><img src="חתונה3.png" alt="" onerror="this.closest('.bg-photo').style.display='none'"></div>
    <div class="bg-photo bg-photo--4"><img src="חתונה4.png" alt="" onerror="this.closest('.bg-photo').style.display='none'"></div>
    <div class="bg-photo bg-photo--5"><img src="חתונה5.png" alt="" onerror="this.closest('.bg-photo').style.display='none'"></div>
</div>

<div id="loginScreen">
    <div class="lock-card">
        <div class="lock-hero">
            <p class="lock-title">ברוכים הבאים ל<span>יומן-השמחות</span></p>
        </div>
        <p class="lock-notice">אתר זה מיועד עבור בני וועד חמישי תשפ"ז בלבד<br>אנא ממכם כבדו את פרטיותינו</p>
        <div class="lock-form-wrap">
            <p class="lock-form-label">להמשך יש להקיש קוד סודי</p>
            <form id="loginForm" autocomplete="off">
                <input type="password" id="codeInput" placeholder="קוד כניסה" inputmode="numeric" autofocus>
                <button type="submit" id="submitBtn">כניסה</button>
                <div class="lock-error" id="errorMsg"></div>
            </form>
        </div>
    </div>
</div>

<iframe id="siteFrame" title="יומן-השמחות"></iframe>

<script>
(function () {
    var CONTENT_URL = "content.enc.json";

    function b64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    async function deriveKey(code, saltBytes, iterations) {
        var baseKey = await crypto.subtle.importKey(
            "raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: saltBytes, iterations: iterations, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );
    }

    var form = document.getElementById("loginForm");
    var input = document.getElementById("codeInput");
    var errorMsg = document.getElementById("errorMsg");
    var submitBtn = document.getElementById("submitBtn");
    var lockCard = document.querySelector(".lock-card");
    var loginScreen = document.getElementById("loginScreen");
    var siteFrame = document.getElementById("siteFrame");

    form.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        var code = input.value;
        if (!code) return;

        errorMsg.textContent = "";
        submitBtn.disabled = true;
        submitBtn.textContent = "בודק...";

        try {
            var res = await fetch(CONTENT_URL, { cache: "no-store" });
            if (!res.ok) throw new Error("content fetch failed");
            var data = await res.json();

            var salt = b64ToBytes(data.salt);
            var iv = b64ToBytes(data.iv);
            var ciphertext = b64ToBytes(data.ciphertext);

            var key = await deriveKey(code, salt, data.iterations);
            var decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, key, ciphertext
            );

            var html = new TextDecoder().decode(decrypted);

            loginScreen.style.display = "none";
            siteFrame.style.display = "block";
            siteFrame.srcdoc = html;
        } catch (err) {
            errorMsg.textContent = "קוד שגוי, נסה/י שוב";
            lockCard.classList.remove("shake");
            void lockCard.offsetWidth;
            lockCard.classList.add("shake");
            input.value = "";
            input.focus();
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "כניסה";
        }
    });
})();
</script>

</body>
</html>
